[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Les templates EJS sont lus sur le disque à l'exécution : il faut les
  # embarquer explicitement dans la fonction.
  included_files = ["views/**"]
  # Modules chargés dynamiquement, laissés hors du bundle esbuild
  external_node_modules = ["ejs"]

# Le routage vers Express est déclaré dans la fonction elle-même
# (config.path = "/*", avec priorité aux fichiers statiques de "public").
